{% extends "base.html" %}{% block title %}Đăng nhập{% endblock %}{% block content %}
<section class="login panel"><div class="eyebrow">KHÔNG GIAN BIÊN TẬP</div><h1>Chào mừng trở lại.</h1><p class="muted">Đăng nhập để quản lý nguồn tin, duyệt bài và lịch xuất bản.</p>
{% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
<form action="/login" method="post">{{ tokens() }}<label>Tên đăng nhập<input name="username" autocomplete="username" required autofocus></label><label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label><button>Đăng nhập →</button></form></section>{% endblock %}
